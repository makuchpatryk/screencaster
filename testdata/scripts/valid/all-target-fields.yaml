# Every target field of the demo: where to go, who is logged in, where MP4s land.
name: all-target-fields
storageState:
  cookies:
    - name: session
      value: abc123
      domain: example.com
      path: /
      expires: -1
      httpOnly: true
      secure: true
      sameSite: Lax
    - name: by-url
      value: x
      url: https://example.com/app
  origins:
    - origin: https://example.com
      localStorage:
        - name: token
          value: t0k3n
outputDir: videos
steps:
  - goto: https://example.com/app/projects
