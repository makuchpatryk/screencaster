name: shots-annotate
type: screenshots
outputDir: docs
steps:
  - goto: http://host.docker.internal:3000/projects
  - screenshot:
      annotate: { selector: "#create", box: true }
  - screenshot:
      selector: "#list"
      annotate: { selector: "#create", box: true, arrow: true, dim: true, label: Click Create }
  - screenshot:
      fullPage: true
      annotate: { selector: "#create", label: Here }
