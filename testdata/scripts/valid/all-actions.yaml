name: all-actions
baseUrl: http://host.docker.internal:3000
steps:
  - goto: /projects
  - click: role=button[name="New project"]
  - fill: { selector: 'input[name="name"]', value: My Project }
  - fill: { selector: 'input[name="notes"]', value: "" }
  - select: { selector: 'select[name="visibility"]', value: private }
  - press: Enter
  - press: { key: Tab, selector: 'input[name="name"]' }
  - hover: text=Create
  - scroll: "#footer"
  - scroll: { y: 0 }
  - wait: 30000
  - wait: "#toast"
