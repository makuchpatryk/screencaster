# An empty narration string keeps the step silent in that language, but still
# counts as an entry for it (FR-002).
name: silent-narration
languages: [en, pl]
steps:
  - goto: http://host.docker.internal:3000/projects
    narration:
      en: ""
      pl: ""
  - wait: 500
    narration:
      en: Welcome to the projects page.
      pl: ""
