name: release

# Manual only (decision 76): run it from a green main with the version to ship.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, X.Y.Z (tag vX.Y.Z)"
        required: true
        type: string

permissions:
  contents: write # the tag and the Release
  packages: write # the image in GHCR

env:
  VERSION: ${{ inputs.version }}
  IMAGE: ghcr.io/makuchpatryk/screencaster

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check the version
        run: |
          echo "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$' \
            || { echo "version must be X.Y.Z, got '$VERSION'"; exit 1; }

      # M5: never ship from a branch or a stale fork ref.
      - name: Only from main
        run: |
          [ "$GITHUB_REF" = refs/heads/main ] || { echo "release runs from main, got $GITHUB_REF"; exit 1; }

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # A tag at another commit would make the Release describe code that was
      # not built here. Re-running for the same commit is fine.
      - name: Check the tag
        run: |
          tagged=$(git ls-remote origin "refs/tags/v$VERSION" "refs/tags/v$VERSION^{}" | awk '{print $1}' | tail -n 1)
          if [ -n "$tagged" ] && [ "$tagged" != "$GITHUB_SHA" ]; then
            echo "tag v$VERSION already points at $tagged, this run is at $GITHUB_SHA; move or delete the tag first"
            exit 1
          fi

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod

      # M5: same gate as ci.yml's check job, run again here since a release
      # can be dispatched for a commit CI has not necessarily finished on.
      - name: Vet and test
        run: |
          go vet -tags e2e ./...
          go test -race ./...

      # Static binaries (the root Dockerfile builds them the same way); the
      # version reaches both mains through one -X flag. A native user runs
      # `screencaster setup`, which fetches the driver, Chromium, Piper and the
      # voices itself, so no playwright CLI ships (decision 77).
      # screencaster-docker is the zero-install path: the same script goes in
      # every tarball and is also a Release asset, since a Docker user needs
      # nothing else.
      - name: Build the binaries
        run: |
          mkdir dist
          sed "s/@VERSION@/$VERSION/" scripts/screencaster-docker.sh > dist/screencaster-docker
          chmod +x dist/screencaster-docker
          for arch in amd64 arm64; do
            export GOOS=linux GOARCH=$arch CGO_ENABLED=0
            go build -trimpath -ldflags "-X main.version=$VERSION" -o "build/$arch/" ./cmd/...
            cp dist/screencaster-docker "build/$arch/"
            tar -C "build/$arch" -czf "dist/screencaster_${VERSION}_linux_${arch}.tar.gz" screencaster screencaster-mcp screencaster-docker
          done

      # M7: lets a downloader verify what they fetched.
      - name: Checksum the assets
        run: (cd dist && sha256sum screencaster_*.tar.gz screencaster-docker > SHA256SUMS)

      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Piper is the only provider, so the tags carry no provider suffix.
      - name: Build and check the image
        run: |
          make image VERSION="$VERSION"
          make image-check

      - name: Push the image
        run: |
          for tag in "$VERSION" latest; do
            docker tag screencaster:piper "$IMAGE:$tag"
            docker push "$IMAGE:$tag"
          done

      # Last, so a failed build never leaves a half-published Release. A rerun
      # for the same commit replaces the assets of the Release that exists.
      - name: Create or update the Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "v$VERSION" >/dev/null 2>&1; then
            gh release upload "v$VERSION" dist/*.tar.gz dist/screencaster-docker dist/SHA256SUMS --clobber
          else
            gh release create "v$VERSION" dist/*.tar.gz dist/screencaster-docker dist/SHA256SUMS \
              --target "$GITHUB_SHA" --title "v$VERSION" --generate-notes
          fi
