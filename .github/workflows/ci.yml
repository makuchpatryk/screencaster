name: ci

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    name: ${{ matrix.module }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module: [core, cli, mcp, tests/e2e]
    defaults:
      run:
        working-directory: ${{ matrix.module }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache-dependency-path: "**/go.sum"
      - uses: golangci/golangci-lint-action@v8
        with:
          # Keep in step with GOLANGCI_LINT_VERSION in the Dockerfile.
          version: v2.12.0
          working-directory: ${{ matrix.module }}
      - run: go vet ./...
      - run: go test -race ./...

  # Image contents and built-in voices (CODE_QUALITY Enforcement). Build only,
  # no push.
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: make image
      - run: make image-check
