name: ci

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

jobs:
  # One module (decision 67), so one job.
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
      - uses: golangci/golangci-lint-action@v8
        with:
          # Keep in step with GOLANGCI_LINT_VERSION in the Dockerfile.
          version: v2.12.0
      - run: go vet -tags e2e ./...
      - run: go test -race ./...

  # Image contents and built-in voices (CODE_QUALITY Enforcement). Build only,
  # no push.
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: make image
      - run: make image-check

  # Real Chromium, Piper and ffmpeg in the dev image: the narration/picture
  # drift gate runs on every push and PR (decision 68). No retries: a flaky
  # run is data for the drift bound, not something to re-run.
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - run: make dev-image PROVIDER=piper
      - run: make e2e PROVIDER=piper
