name: ci

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

jobs:
  # One module (decision 67), so one job.
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: "1.26.10"
      - uses: golangci/golangci-lint-action@4afd733a84b1f43292c63897423277bb7f4313a9 # v8.0.0
        with:
          # Keep in step with GOLANGCI_LINT_VERSION in the Dockerfile.
          version: v2.12.0
      - run: go vet -tags e2e ./...
      - run: go test -race ./...
      # Reachable stdlib and module advisories fail the job (H1 of the security audit).
      - run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...

  # Image contents and built-in voices (CODE_QUALITY Enforcement). Build only,
  # no push.
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - run: make image
      - run: make image-check

  # Real Chromium, Piper and ffmpeg in the dev image: the narration/picture
  # drift gate runs on every push and PR (decision 68). No retries: a flaky
  # run is data for the drift bound, not something to re-run.
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      # ubuntu-latest's kernel restricts unprivileged user namespaces (the
      # same Ubuntu 24.04+ default Decision 83's AppArmor profile targets on
      # native installs); the runner has no per-binary AppArmor profile for
      # the dev image's Chromium, so the sandbox needs this master switch off
      # for the job instead. Container-local, not a product change: the
      # shipped seccomp profile (scripts/seccomp-chromium.json) is unchanged.
      - run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - run: make dev-image PROVIDER=piper
      - run: make e2e PROVIDER=piper E2E_RACE=-race
