<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<style>
  html, body { margin: 0; width: 1920px; height: 1080px; }
  body {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    box-sizing: border-box;
    padding: 0 200px;
    background: #0f172a;
    color: #ffffff;
    font-family: "Noto Sans", "DejaVu Sans", "Liberation Sans", Arial, sans-serif;
    text-align: center;
  }
  h1 { margin: 0; font-size: 96px; font-weight: 700; line-height: 1.15; overflow-wrap: anywhere; }
  p { margin: 48px 0 0; font-size: 44px; line-height: 1.4; color: #94a3b8; overflow-wrap: anywhere; }
</style>
</head>
<body>
<h1>{{.Title}}</h1>
{{if .Subtitle}}<p>{{.Subtitle}}</p>{{end}}
</body>
</html>
