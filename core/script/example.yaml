name: create-project
languages: [en, pl]
meta:
  title: How to create a project
  description: Create a project from the projects page.
  audience: release-notes
steps:
  - action: goto
    url: /projects
    narration:
      en: This is the projects page.
      pl: To jest strona projektów.
  - action: click
    selector: role=button[name="New project"]
    narration:
      en: Click the New project button.
      pl: Kliknij przycisk Nowy projekt.
  - action: fill
    selector: input[name="name"]
    value: My Project
  - action: select
    selector: select[name="visibility"]
    value: private
  - action: hover
    selector: role=button[name="Create"]
  - action: press
    key: Enter
    selector: input[name="name"]
    narration:
      en: Press Enter to create the project.
      pl: Naciśnij Enter, aby utworzyć projekt.
  - action: wait
    selector: "#toast-success"
  - action: scroll
    y: 400
  - action: wait
    ms: 1000
