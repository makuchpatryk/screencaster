# Run: HOST_UID=$(id -u) HOST_GID=$(id -g) docker compose run --rm screencaster render demos/my-demo.yaml
services:
  screencaster:
    # Built by `make image` (base plus providers/piper); compose cannot chain the
    # two builds. Another provider: `make image PROVIDER=<name>` and its tag here.
    image: screencaster:piper
    entrypoint: ["screencaster"]
    # Forwards SIGTERM so a stopped render cleans up.
    init: true
    # The caller's ids, so rendered files are not root-owned. Fails if unset.
    user: "${HOST_UID:?set HOST_UID to id -u}:${HOST_GID:?set HOST_GID to id -g}"
    # Chromium's userns sandbox (decision 83); without it render fails with the
    # sandbox error. Path is relative to this file, not the caller's $PWD.
    security_opt:
      - seccomp=./scripts/seccomp-chromium.json
    volumes:
      - .:/work
