name: portfolio-projects
baseUrl: https://makuchpatryk.com
languages: [en, pl]
meta:
  title: makuchpatryk.com projects tour
  description: Open the portfolio, browse all projects, open the AI Book Chat case study.
  audience: marketing
steps:
  - action: goto
    url: /
    narration:
      en: This is my portfolio site.
      pl: To jest moja strona portfolio.
  - action: wait
    ms: 1000
  - action: goto
    url: /projects
    narration:
      en: Here is the full list of my projects.
      pl: Oto pełna lista moich projektów.
  - action: scroll
    y: 600
    narration:
      en: Scroll down to see each one.
      pl: Przewijam w dół, żeby zobaczyć każdy z nich.
  - action: wait
    ms: 1000
  - action: scroll
    y: 1300
  - action: wait
    ms: 1000
  - action: scroll
    selector: role=heading[name="Sudoku"]
    narration:
      en: That is all eight projects, from AI Book Chat to Sudoku.
      pl: To wszystkie osiem projektów, od AI Book Chat do Sudoku.
  - action: wait
    ms: 1000
  - action: scroll
    y: 0
  - action: click
    selector: h2 >> a[href="/projects/ai-book-chat"]
    narration:
      en: Now open AI Book Chat, a PDF question-answering app with a local RAG pipeline.
      pl: Otwieram AI Book Chat, aplikację do pytań o PDF z lokalnym potokiem RAG.
  - action: wait
    ms: 2000
